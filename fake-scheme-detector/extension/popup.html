<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 260px; font-family: Arial, sans-serif; padding: 12px; margin: 0; background-color: #f8f9fa; }
    h3 { margin-top: 0; font-size: 15px; color: #212529; text-align: center; }
    .status-card { padding: 15px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 14px; margin-bottom: 12px; color: white; background-color: #6c757d; transition: background 0.3s ease; }
    .score-text { font-size: 13px; color: #495057; text-align: center; margin-bottom: 12px; font-weight: 500; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h3>Scheme Safety Verification</h3>
  <div id="statusBox" class="status-card">READY TO SCAN</div>
  <div class="score-text" id="scoreBox">Risk Level: --</div>
  <button id="scanBtn">Scan Live Page</button>
  <script src="popup.js"></script>
</body>
</html>
